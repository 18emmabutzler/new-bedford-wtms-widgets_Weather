<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: "Avenir Next", Arial, sans-serif;
    color: #ffffff;
  }

  .info-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    white-space: nowrap;
    font-size: 12px;
    padding: 5px;
    color: #ffffff;
  }

  .info-item {
    color: #ffffff;
  }

  .info-label {
    font-weight: 600;
    color: #ffffff;
  }

  .separator {
    color: #ffffff;
    opacity: 0.65;
  }
</style>

<div class="info-line">

  <span class="info-item">
    <span class="info-label">High:</span>
    <span id="highTide">Loading...</span>
  </span>

  <span class="separator">|</span>

  <span class="info-item">
    <span class="info-label">Low:</span>
    <span id="lowTide">Loading...</span>
  </span>

  <span class="separator">|</span>

  <span class="info-item">
    <span class="info-label">Temp:</span>
    <span id="airTemp">Loading...</span>
  </span>

  <span class="separator">|</span>

  <span class="info-item">
    <span class="info-label">Pressure:</span>
    <span id="pressure">Loading...</span>
  </span>

  <span class="separator">|</span>

  <span class="info-item">
    <span class="info-label">Wind:</span>
    <span id="wind">Loading...</span>
  </span>

  <span class="separator">|</span>

  <span class="info-item">
    <span class="info-label">Gust:</span>
    <span id="gust">Loading...</span>
  </span>

</div>

<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: "Avenir Next", Avenir, Arial, sans-serif;
}

/* ONE-LINE ALERT BAR */

#alertBar {
    box-sizing: border-box;
    width: 100%;
    height: 32px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0 14px;

    background: #ffffff;
    color: #000000;

    border: 1px solid #d9d9d9;
    border-radius: 3px;

    font-size: 12px;
    font-weight: 600;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


/* ACTIVE ALERT */

#alertBar.active {
    background: #c62828;
    color: #ffffff;
    border-color: #c62828;
}

</style>
</head>


<body>

<div id="alertBar">
    Checking current alerts...
</div>


<script>

/* -----------------------------------
   PORT OF NEW BEDFORD

   MAZ020 = Southern Bristol
   ANZ234 = Buzzards Bay
------------------------------------ */

const zones = [
    {
        id: "MAZ020",
        name: "New Bedford"
    },
    {
        id: "ANZ234",
        name: "Buzzards Bay"
    }
];


/* -----------------------------------
   FORMAT END TIME
------------------------------------ */

function formatEndTime(dateString) {

    if (!dateString) {
        return "";
    }

    const date = new Date(dateString);

    return date.toLocaleString("en-US", {
        timeZone: "America/New_York",
        weekday: "short",
        hour: "numeric",
        minute: "2-digit",
        hour12: true
    });

}


/* -----------------------------------
   CREATE SHORT HAZARD DESCRIPTION
------------------------------------ */

function getShortDescription(description) {

    if (!description) {
        return "";
    }

    let text = description
        .replace(/\n+/g, " ")
        .replace(/\s+/g, " ")
        .trim();


    /* Look for the NWS WHAT section */

    const whatMatch =
        text.match(/\* WHAT\.\.\.(.*?)(?=\* WHERE|\* WHEN|\* IMPACTS|$)/i);

    if (whatMatch && whatMatch[1]) {

        return whatMatch[1]
            .trim()
            .replace(/\.$/, "");

    }


    /* If WHAT is not available, use first sentence */

    const firstSentence =
        text.match(/^(.+?[.!?])(?:\s|$)/);

    if (firstSentence) {

        return firstSentence[1]
            .trim()
            .replace(/\.$/, "");

    }


    /* Last fallback */

    if (text.length > 150) {
        return text.substring(0, 147) + "...";
    }

    return text;

}


/* -----------------------------------
   LOAD ALERTS
------------------------------------ */

async function loadAlerts() {

    const bar =
        document.getElementById("alertBar");

    try {

        let alerts = [];


        /* CHECK BOTH NWS ZONES */

        for (const zone of zones) {

            const url =
                `https://api.weather.gov/alerts/active/zone/${zone.id}`;


            const response =
                await fetch(url, {

                    headers: {
                        "Accept": "application/geo+json"
                    }

                });


            if (!response.ok) {

                throw new Error(
                    `NWS API error ${response.status}`
                );

            }


            const data =
                await response.json();


            if (data.features) {

                data.features.forEach(feature => {

                    const p =
                        feature.properties || {};


                    alerts.push({

                        id:
                            p.id ||
                            feature.id ||
                            "",

                        event:
                            p.event ||
                            "Weather Alert",

                        location:
                            zone.name,

                        ends:
                            p.ends ||
                            p.expires ||
                            "",

                        description:
                            p.description ||
                            "",

                        severity:
                            p.severity ||
                            ""

                    });

                });

            }

        }


        /* -----------------------------------
           REMOVE DUPLICATES
        ------------------------------------ */

        const unique = [];

        const seen = new Set();


        alerts.forEach(alert => {

            const key =
                alert.id ||
                alert.event + alert.location;


            if (!seen.has(key)) {

                seen.add(key);

                unique.push(alert);

            }

        });


        /* -----------------------------------
           NO ACTIVE ALERTS
        ------------------------------------ */

        if (unique.length === 0) {

            bar.classList.remove("active");

            bar.textContent =
                "No Active Weather or Marine Alerts";

            return;

        }


        /* -----------------------------------
           ACTIVE ALERT
        ------------------------------------ */

        bar.classList.add("active");


        const alert =
            unique[0];


        const endTime =
            formatEndTime(alert.ends);


        const details =
            getShortDescription(alert.description);


        let parts = [];


        /* ALERT TYPE + LOCATION */

        parts.push(
            `${alert.event.toUpperCase()} — ${alert.location}`
        );


        /* END TIME */

        if (endTime) {

            parts.push(
                `Until ${endTime}`
            );

        }


        /* QUICK DETAILS */

        if (details) {

            parts.push(details);

        }


        /* BUILD ONE LINE */

        bar.textContent =
            parts.join("  |  ");


        /* Show full text on hover */

        bar.title =
            bar.textContent;

    }


    catch (error) {

        console.error(
            "NWS Alert Error:",
            error
        );


        bar.classList.remove("active");

        bar.textContent =
            "Weather Alert Data Unavailable";

    }

}


/* CHECK IMMEDIATELY */

loadAlerts();


/* REFRESH EVERY 5 MINUTES */

setInterval(
    loadAlerts,
    5 * 60 * 1000
);

</script>

</body>

</html>

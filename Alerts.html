<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buzzards Bay Marine Alert</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
}


/* =========================================================
   ALERT BANNER
========================================================= */

.alert-banner {

    width: 100%;
    height: 115px;

    background: #c62828;
    color: #ffffff;

    border-radius: 7px;

    padding: 12px 16px;

    display: flex;
    flex-direction: column;
    justify-content: center;

    overflow: hidden;
}


/* =========================================================
   TOP ROW
========================================================= */

.alert-top {

    display: flex;
    align-items: center;
    gap: 8px;

    white-space: nowrap;
}


.alert-title {

    font-size: 18px;
    font-weight: 700;
}


.divider {

    opacity: 0.55;
}


.alert-time {

    font-size: 10px;
}


.alert-time strong {

    font-weight: 700;
}


.zone {

    margin-left: auto;

    padding: 3px 6px;

    border:
        1px solid rgba(255,255,255,0.6);

    border-radius: 3px;

    font-size: 8px;
    font-weight: 700;
}


/* =========================================================
   WHAT
========================================================= */

.alert-what {

    margin-top: 8px;

    font-size: 12px;
    font-weight: 700;

    line-height: 1.3;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


/* =========================================================
   IMPACT
========================================================= */

.alert-impact {

    margin-top: 6px;

    font-size: 9px;

    line-height: 1.3;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


.alert-impact strong {

    font-weight: 700;
}


/* =========================================================
   NO ALERT
========================================================= */

.alert-banner.no-alert {

    height: 70px;

    background: #4b6478;
}


/* =========================================================
   ERROR
========================================================= */

.alert-banner.error {

    height: 70px;

    background: #687684;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 700px) {

    .alert-banner {

        height: auto;
        min-height: 115px;
    }


    .alert-top {

        flex-wrap: wrap;
        white-space: normal;
    }


    .zone {

        margin-left: 0;
    }


    .alert-what,
    .alert-impact {

        white-space: normal;
    }

}

</style>

</head>


<body>


<div
    id="alertBanner"
    class="alert-banner"
>


    <!-- TOP ROW -->

    <div class="alert-top">


        <div
            id="alertTitle"
            class="alert-title"
        >
            Checking Marine Alerts...
        </div>


        <span class="divider">
            |
        </span>


        <div class="alert-time">

            <strong>Issued:</strong>

            <span id="alertIssued">
                --
            </span>

        </div>


        <span class="divider">
            |
        </span>


        <div class="alert-time">

            <strong>Ends:</strong>

            <span id="alertEnds">
                --
            </span>

        </div>


        <div class="zone">

            BUZZARDS BAY · ANZ234

        </div>


    </div>



    <!-- WHAT -->

    <div
        id="alertWhat"
        class="alert-what"
    >

        Loading marine hazard information...

    </div>



    <!-- IMPACTS -->

    <div
        id="alertImpact"
        class="alert-impact"
    >

        <strong>Impacts:</strong>

        <span id="impactText">
            Loading...
        </span>

    </div>


</div>



<script>


/* =========================================================
   SETTINGS
========================================================= */

const ZONE =
    "ANZ234";

const TIMEZONE =
    "America/New_York";

const ALERT_URL =
    `https://api.weather.gov/alerts/active/zone/${ZONE}`;


/* =========================================================
   CLEAN TEXT
========================================================= */

function cleanText(text) {

    if (!text) {
        return "";
    }

    return text
        .replace(/\r/g, "")
        .replace(/\t/g, " ")
        .replace(/\n+/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}


/* =========================================================
   FORMAT DATE / TIME
========================================================= */

function formatDateTime(dateString) {

    if (!dateString) {
        return "--";
    }

    return new Date(dateString)
        .toLocaleString(

            "en-US",

            {
                timeZone: TIMEZONE,
                weekday: "short",
                month: "short",
                day: "numeric",
                hour: "numeric",
                minute: "2-digit",
                hour12: true
            }

        );
}


/* =========================================================
   EXTRACT NWS SECTION
========================================================= */

function extractSection(
    text,
    section
) {

    if (!text) {
        return "";
    }


    const sections =
        "WHAT|WHERE|WHEN|IMPACTS|ADDITIONAL DETAILS";


    const regex =
        new RegExp(

            `\\*\\s*${section}\\.\\.\\.([\\s\\S]*?)(?=\\*\\s*(?:${sections})\\.\\.\\.|PRECAUTIONARY\\/PREPAREDNESS ACTIONS|&&|\\$\\$|$)`,

            "i"

        );


    const match =
        text.match(regex);


    if (!match) {
        return "";
    }


    return cleanText(
        match[1]
    );
}


/* =========================================================
   ALERT PRIORITY
========================================================= */

function getAlertPriority(alert) {

    const event =
        (
            alert.event ||
            ""
        ).toLowerCase();


    if (event.includes("warning")) {
        return 1;
    }


    if (event.includes("watch")) {
        return 2;
    }


    if (event.includes("advisory")) {
        return 3;
    }


    return 4;
}


/* =========================================================
   LOAD ALERT
========================================================= */

async function loadAlert() {


    const banner =
        document.getElementById(
            "alertBanner"
        );


    try {


        const response =
            await fetch(

                ALERT_URL,

                {
                    headers: {
                        "Accept":
                            "application/geo+json"
                    }
                }

            );


        if (!response.ok) {

            throw new Error(
                "NWS alert request failed"
            );

        }


        const data =
            await response.json();


        const alerts =
            (data.features || [])

                .map(
                    feature =>
                        feature.properties
                )

                .sort(
                    (a, b) =>
                        getAlertPriority(a) -
                        getAlertPriority(b)
                );


        /* =================================================
           NO ACTIVE ALERT
        ================================================= */

        if (!alerts.length) {


            banner.className =
                "alert-banner no-alert";


            document.getElementById(
                "alertTitle"
            ).textContent =
                "No Active Marine Alerts";


            document.getElementById(
                "alertIssued"
            ).textContent =
                "--";


            document.getElementById(
                "alertEnds"
            ).textContent =
                "--";


            document.getElementById(
                "alertWhat"
            ).textContent =
                "No active watches, warnings or advisories for Buzzards Bay.";


            document.getElementById(
                "alertImpact"
            ).style.display =
                "none";


            return;

        }



        /* =================================================
           ACTIVE ALERT
        ================================================= */

        banner.className =
            "alert-banner";


        document.getElementById(
            "alertImpact"
        ).style.display =
            "block";


        const alert =
            alerts[0];


        /* ALERT NAME */

        document.getElementById(
            "alertTitle"
        ).textContent =
            alert.event ||
            "Marine Weather Alert";



        /* =================================================
           ISSUED
        ================================================= */

        const issuedTime =
            alert.sent ||
            alert.effective ||
            alert.onset;


        document.getElementById(
            "alertIssued"
        ).textContent =

            issuedTime

                ? formatDateTime(
                    issuedTime
                )

                : "Not reported";



        /* =================================================
           ENDS
        ================================================= */

        const endTime =
            alert.ends ||
            alert.expires;


        document.getElementById(
            "alertEnds"
        ).textContent =

            endTime

                ? formatDateTime(
                    endTime
                )

                : "Until further notice";



        /* =================================================
           DESCRIPTION
        ================================================= */

        const description =
            alert.description ||
            "";


        /* WHAT */

        const what =
            extractSection(
                description,
                "WHAT"
            );


        const whatText =
            what ||
            alert.headline ||
            "See National Weather Service alert information.";


        document.getElementById(
            "alertWhat"
        ).textContent =
            whatText;


        document.getElementById(
            "alertWhat"
        ).title =
            whatText;



        /* IMPACTS */

        const impacts =
            extractSection(
                description,
                "IMPACTS"
            );


        const impactText =
            impacts ||
            "See National Weather Service alert for marine impacts.";


        document.getElementById(
            "impactText"
        ).textContent =
            impactText;


        document.getElementById(
            "alertImpact"
        ).title =
            impactText;


    }


    catch (error) {


        console.error(
            "Marine Alert Error:",
            error
        );


        banner.className =
            "alert-banner error";


        document.getElementById(
            "alertTitle"
        ).textContent =
            "Marine Alert Data Unavailable";


        document.getElementById(
            "alertIssued"
        ).textContent =
            "--";


        document.getElementById(
            "alertEnds"
        ).textContent =
            "--";


        document.getElementById(
            "alertWhat"
        ).textContent =
            "Unable to retrieve current NWS marine alerts.";


        document.getElementById(
            "alertImpact"
        ).style.display =
            "none";

    }

}


/* =========================================================
   INITIAL LOAD
========================================================= */

loadAlert();


/* =========================================================
   REFRESH EVERY 5 MINUTES
========================================================= */

setInterval(

    loadAlert,

    5 * 60 * 1000

);


</script>


</body>

</html>

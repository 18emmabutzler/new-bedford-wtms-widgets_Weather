<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>New Bedford Weather</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
    color: #17233b;
}

.weather-card {
    width: 100%;
    background: #ffffff;
    border: 1px solid #d9d9d9;
    border-radius: 8px;
    overflow: hidden;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    padding: 8px 10px 7px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #e5e5e5;
}

.title {
    font-size: 14px;
    font-weight: 700;
}

.subtitle {
    margin-top: 2px;
    font-size: 8px;
    color: #777;
}

.badge {
    padding: 3px 5px;
    border: 1px solid #aaa;
    border-radius: 3px;
    font-size: 8px;
    font-weight: 700;
}


/* =========================================================
   CURRENT CONDITIONS
========================================================= */

.current-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-bottom: 1px solid #ddd;
}

.current-item {
    padding: 7px 5px;
    text-align: center;
    border-right: 1px solid #e5e5e5;
}

.current-item:last-child {
    border-right: none;
}

.label {
    font-size: 7px;
    color: #777;
    text-transform: uppercase;
    letter-spacing: 0.3px;
}

.value {
    margin-top: 3px;
    font-size: 13px;
    font-weight: 700;
    color: #0b1f3a;
}

.small-value {
    margin-top: 2px;
    font-size: 7px;
    color: #777;
}


/* =========================================================
   FORECAST HEADER
========================================================= */

.forecast-heading {
    padding: 7px 9px 5px 9px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.forecast-heading-title {
    font-size: 10px;
    font-weight: 700;
}

.updated {
    font-size: 7px;
    color: #888;
}


/* =========================================================
   3 DAY FORECAST
========================================================= */

.forecast-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    padding: 0 7px 7px 7px;
    gap: 5px;
}

.day {
    padding: 6px;
    background: #f5f6f7;
    border: 1px solid #ddd;
    border-radius: 5px;
}

.day-name {
    font-size: 10px;
    font-weight: 700;
}

.day-date {
    margin-top: 1px;
    font-size: 7px;
    color: #888;
}

.temp-row {
    margin-top: 4px;
    display: flex;
    align-items: baseline;
    gap: 5px;
}

.high {
    font-size: 16px;
    font-weight: 700;
}

.low {
    font-size: 9px;
    color: #777;
}

.description {
    margin-top: 3px;
    min-height: 20px;
    font-size: 8px;
    font-weight: 600;
    line-height: 1.25;
}

.details {
    margin-top: 4px;
    padding-top: 4px;
    border-top: 1px solid #ddd;
}

.detail {
    display: flex;
    justify-content: space-between;
    gap: 4px;
    margin-top: 2px;
    font-size: 7px;
}

.detail-label {
    color: #777;
}

.detail-value {
    font-weight: 600;
    text-align: right;
}


/* =========================================================
   FOOTER LINK
========================================================= */

.footer {
    padding: 0 7px 7px 7px;
}

.link {
    display: block;
    padding: 5px;
    background: #074b78;
    border-radius: 4px;
    color: white;
    text-align: center;
    text-decoration: none;
    font-size: 8px;
    font-weight: 700;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 450px) {

    .current-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .forecast-grid {
        grid-template-columns: 1fr;
    }

}

</style>
</head>


<body>

<div class="weather-card">


    <!-- HEADER -->

    <div class="header">

        <div>
            <div class="title">
                New Bedford Harbor Weather
            </div>

            <div id="stationName" class="subtitle">
                Current Conditions
            </div>
        </div>

        <div class="badge">
            NWS
        </div>

    </div>



    <!-- CURRENT CONDITIONS -->

    <div class="current-grid">


        <div class="current-item">

            <div class="label">
                Temperature
            </div>

            <div id="temperature" class="value">
                --
            </div>

        </div>


        <div class="current-item">

            <div class="label">
                Pressure
            </div>

            <div id="pressure" class="value">
                --
            </div>

        </div>


        <div class="current-item">

            <div class="label">
                Wind
            </div>

            <div id="wind" class="value">
                --
            </div>

            <div id="windDirection" class="small-value">
                --
            </div>

        </div>


        <div class="current-item">

            <div class="label">
                Gust
            </div>

            <div id="gust" class="value">
                --
            </div>

        </div>


    </div>



    <!-- FORECAST HEADER -->

    <div class="forecast-heading">

        <div class="forecast-heading-title">
            3-Day Forecast
        </div>

        <div id="updated" class="updated">
            Updating...
        </div>

    </div>



    <!-- FORECAST -->

    <div id="forecastGrid" class="forecast-grid">

        <div class="day">
            Loading...
        </div>

        <div class="day">
            Loading...
        </div>

        <div class="day">
            Loading...
        </div>

    </div>



    <!-- LINK -->

    <div class="footer">

        <a
            class="link"
            href="https://forecast.weather.gov/MapClick.php?lat=41.628&lon=-70.908"
            target="_blank"
            rel="noopener noreferrer"
        >
            Full NWS Forecast
        </a>

    </div>


</div>



<script>

/* =========================================================
   SETTINGS
========================================================= */

const LATITUDE = 41.628;
const LONGITUDE = -70.908;

const TIMEZONE =
    "America/New_York";

const POINT_URL =
    `https://api.weather.gov/points/${LATITUDE},${LONGITUDE}`;


/* =========================================================
   NWS FETCH
========================================================= */

async function fetchNWS(url) {

    const response =
        await fetch(
            url,
            {
                headers: {
                    "Accept":
                        "application/geo+json"
                }
            }
        );

    if (!response.ok) {
        throw new Error(
            `NWS request failed: ${response.status}`
        );
    }

    return await response.json();
}


/* =========================================================
   CONVERSIONS
========================================================= */

function cToF(c) {

    if (
        c === null ||
        c === undefined
    ) {
        return null;
    }

    return (c * 9 / 5) + 32;
}


function paToMb(pa) {

    if (
        pa === null ||
        pa === undefined
    ) {
        return null;
    }

    return pa / 100;
}


function kmhToKnots(kmh) {

    if (
        kmh === null ||
        kmh === undefined
    ) {
        return null;
    }

    return kmh * 0.539957;
}


/* =========================================================
   WIND DIRECTION
========================================================= */

function degreesToCardinal(degrees) {

    if (
        degrees === null ||
        degrees === undefined
    ) {
        return "--";
    }

    const directions = [
        "N",
        "NNE",
        "NE",
        "ENE",
        "E",
        "ESE",
        "SE",
        "SSE",
        "S",
        "SSW",
        "SW",
        "WSW",
        "W",
        "WNW",
        "NW",
        "NNW"
    ];

    return directions[
        Math.round(degrees / 22.5) % 16
    ];
}


/* =========================================================
   CURRENT CONDITIONS
========================================================= */

async function loadCurrent(pointData) {

    try {

        const stationURL =
            pointData.properties
                .observationStations;

        const stationData =
            await fetchNWS(
                stationURL
            );

        const station =
            stationData.features[0];

        const stationID =
            station.properties
                .stationIdentifier;

        const stationName =
            station.properties.name ||
            stationID;

        document.getElementById(
            "stationName"
        ).textContent =
            `Current Conditions · ${stationName}`;


        const observation =
            await fetchNWS(
                `https://api.weather.gov/stations/${stationID}/observations/latest`
            );

        const obs =
            observation.properties;


        /* TEMPERATURE */

        const temp =
            cToF(
                obs.temperature?.value
            );

        document.getElementById(
            "temperature"
        ).textContent =
            temp !== null
                ? `${temp.toFixed(0)}°F`
                : "--";


        /* PRESSURE */

        const mb =
            paToMb(
                obs.barometricPressure?.value
            );

        document.getElementById(
            "pressure"
        ).textContent =
            mb !== null
                ? `${mb.toFixed(0)} mb`
                : "--";


        /* WIND */

        const windKnots =
            kmhToKnots(
                obs.windSpeed?.value
            );

        document.getElementById(
            "wind"
        ).textContent =
            windKnots !== null
                ? `${windKnots.toFixed(0)} kt`
                : "--";


        const degrees =
            obs.windDirection?.value;

        document.getElementById(
            "windDirection"
        ).textContent =
            degrees !== null &&
            degrees !== undefined

                ? degreesToCardinal(
                    degrees
                )

                : "--";


        /* GUST */

        const gustKnots =
            kmhToKnots(
                obs.windGust?.value
            );

        document.getElementById(
            "gust"
        ).textContent =
            gustKnots !== null
                ? `${gustKnots.toFixed(0)} kt`
                : "--";

    }

    catch (error) {

        console.error(
            "Current conditions error:",
            error
        );

        document.getElementById(
            "stationName"
        ).textContent =
            "Current Conditions Unavailable";
    }

}


/* =========================================================
   GROUP FORECAST BY DAY
========================================================= */

function groupDays(periods) {

    const days = {};

    periods.forEach(period => {

        const date =
            new Date(
                period.startTime
            );

        const key =
            date.toLocaleDateString(
                "en-CA",
                {
                    timeZone:
                        TIMEZONE
                }
            );

        if (!days[key]) {

            days[key] = {
                date: date,
                day: null,
                night: null
            };

        }

        if (period.isDaytime) {
            days[key].day =
                period;
        }

        else {
            days[key].night =
                period;
        }

    });


    return Object
        .values(days)
        .slice(0, 3);
}


/* =========================================================
   CREATE DAY
========================================================= */

function createDayCard(day) {

    const daytime =
        day.day;

    const nighttime =
        day.night;

    const primary =
        daytime ||
        nighttime;


    const dayName =
        day.date.toLocaleDateString(
            "en-US",
            {
                timeZone:
                    TIMEZONE,
                weekday:
                    "short"
            }
        );


    const date =
        day.date.toLocaleDateString(
            "en-US",
            {
                timeZone:
                    TIMEZONE,
                month:
                    "numeric",
                day:
                    "numeric"
            }
        );


    const high =
        daytime
            ? `${daytime.temperature}°`
            : "--";


    const low =
        nighttime
            ? `${nighttime.temperature}°`
            : "--";


    const forecast =
        primary?.shortForecast ||
        "--";


    const precip =
        primary
            ?.probabilityOfPrecipitation
            ?.value;


    const precipText =
        precip !== null &&
        precip !== undefined

            ? `${precip}%`

            : "--";


    const wind =
        primary

            ? `${primary.windDirection} ${primary.windSpeed}`

            : "--";


    return `

        <div class="day">

            <div class="day-name">
                ${dayName}
            </div>

            <div class="day-date">
                ${date}
            </div>

            <div class="temp-row">

                <div class="high">
                    ${high}
                </div>

                <div class="low">
                    Low ${low}
                </div>

            </div>

            <div class="description">
                ${forecast}
            </div>

            <div class="details">

                <div class="detail">

                    <span class="detail-label">
                        Rain
                    </span>

                    <span class="detail-value">
                        ${precipText}
                    </span>

                </div>

                <div class="detail">

                    <span class="detail-label">
                        Wind
                    </span>

                    <span class="detail-value">
                        ${wind}
                    </span>

                </div>

            </div>

        </div>

    `;
}


/* =========================================================
   FORECAST
========================================================= */

async function loadForecast(
    pointData
) {

    try {

        const forecastURL =
            pointData.properties
                .forecast;

        const forecastData =
            await fetchNWS(
                forecastURL
            );

        const periods =
            forecastData.properties
                .periods;

        const days =
            groupDays(
                periods
            );


        document.getElementById(
            "forecastGrid"
        ).innerHTML =
            days
                .map(createDayCard)
                .join("");

    }

    catch (error) {

        console.error(
            "Forecast error:",
            error
        );

        document.getElementById(
            "forecastGrid"
        ).innerHTML =
            `<div class="day">
                Forecast unavailable
             </div>`;
    }

}


/* =========================================================
   UPDATED TIME
========================================================= */

function setUpdated() {

    const time =
        new Date()
            .toLocaleTimeString(
                "en-US",
                {
                    timeZone:
                        TIMEZONE,
                    hour:
                        "numeric",
                    minute:
                        "2-digit",
                    hour12:
                        true
                }
            );

    document.getElementById(
        "updated"
    ).textContent =
        `Updated ${time}`;
}


/* =========================================================
   LOAD EVERYTHING
========================================================= */

async function loadWeather() {

    try {

        const pointData =
            await fetchNWS(
                POINT_URL
            );

        await Promise.all([
            loadCurrent(pointData),
            loadForecast(pointData)
        ]);

        setUpdated();

    }

    catch (error) {

        console.error(
            "Weather error:",
            error
        );

    }

}


/* INITIAL LOAD */

loadWeather();


/* REFRESH EVERY 10 MINUTES */

setInterval(
    loadWeather,
    10 * 60 * 1000
);

</script>

</body>
</html>

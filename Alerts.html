<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Port of New Bedford Weather Alerts</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: "Avenir Next", Avenir, Arial, sans-serif;
}


/* =========================================================
   ALERT BANNER
========================================================= */

.alert-banner {

    width: 100%;
    height: 115px;

    background: #c62828;
    color: #ffffff;

    border-radius: 7px;

    padding: 12px 16px;

    display: flex;
    flex-direction: column;
    justify-content: center;

    overflow: hidden;
}


/* =========================================================
   TOP ROW
========================================================= */

.alert-top {

    display: flex;
    align-items: center;
    gap: 8px;

    white-space: nowrap;
}


.alert-title {

    font-size: 18px;
    font-weight: 700;
}


.divider {

    opacity: 0.55;
}


.alert-time {

    font-size: 10px;
}


.alert-time strong {

    font-weight: 700;
}


.zone {

    margin-left: auto;

    padding: 3px 6px;

    border: 1px solid rgba(255,255,255,0.6);

    border-radius: 3px;

    font-size: 8px;
    font-weight: 700;
}


/* =========================================================
   WHAT
========================================================= */

.alert-what {

    margin-top: 8px;

    font-size: 12px;
    font-weight: 700;

    line-height: 1.3;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


/* =========================================================
   IMPACTS
========================================================= */

.alert-impact {

    margin-top: 6px;

    font-size: 9px;

    line-height: 1.3;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


.alert-impact strong {

    font-weight: 700;
}


/* =========================================================
   NO ALERT
========================================================= */

.alert-banner.no-alert {

    height: 70px;

    background: #ffffff;
    color: #000000;

    border: 1px solid #d9d9d9;
}


.alert-banner.no-alert .zone {

    border-color: #999999;
}


/* =========================================================
   ERROR
========================================================= */

.alert-banner.error {

    height: 70px;

    background: #687684;
    color: #ffffff;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 700px) {

    .alert-banner {

        height: auto;
        min-height: 115px;

    }


    .alert-top {

        flex-wrap: wrap;
        white-space: normal;

    }


    .zone {

        margin-left: 0;

    }


    .alert-what,
    .alert-impact {

        white-space: normal;

    }

}

</style>
</head>


<body>


<div
    id="alertBanner"
    class="alert-banner"
>


    <!-- TOP ROW -->

    <div class="alert-top">


        <div
            id="alertTitle"
            class="alert-title"
        >
            Checking Weather Alerts...
        </div>


        <span class="divider">
            |
        </span>


        <div class="alert-time">

            <strong>Issued:</strong>

            <span id="alertIssued">
                --
            </span>

        </div>


        <span class="divider">
            |
        </span>


        <div class="alert-time">

            <strong>Ends:</strong>

            <span id="alertEnds">
                --
            </span>

        </div>


        <div
            id="alertZone"
            class="zone"
        >
            PORT OF NEW BEDFORD
        </div>


    </div>



    <!-- WHAT -->

    <div
        id="alertWhat"
        class="alert-what"
    >

        Loading hazard information...

    </div>



    <!-- IMPACTS -->

    <div
        id="alertImpact"
        class="alert-impact"
    >

        <strong>Impacts:</strong>

        <span id="impactText">
            Loading...
        </span>

    </div>


</div>



<script>


/* =========================================================
   SETTINGS

   MAZ020 = Southern Bristol / New Bedford
   ANZ234 = Buzzards Bay

   IMPORTANT:
   If MAZ020 has ANY active alert, it will be displayed
   before an ANZ234 alert.
========================================================= */


const ZONES = [

    {
        id: "MAZ020",
        name: "NEW BEDFORD"
    },

    {
        id: "ANZ234",
        name: "BUZZARDS BAY"
    }

];


const TIMEZONE =
    "America/New_York";



/* =========================================================
   CLEAN TEXT
========================================================= */

function cleanText(text) {

    if (!text) {

        return "";

    }


    return text

        .replace(/\r/g, "")

        .replace(/\t/g, " ")

        .replace(/\n+/g, " ")

        .replace(/\s+/g, " ")

        .trim();

}



/* =========================================================
   FORMAT DATE / TIME
========================================================= */

function formatDateTime(dateString) {

    if (!dateString) {

        return "--";

    }


    return new Date(dateString)

        .toLocaleString(

            "en-US",

            {

                timeZone: TIMEZONE,

                weekday: "short",

                month: "short",

                day: "numeric",

                hour: "numeric",

                minute: "2-digit",

                hour12: true

            }

        );

}



/* =========================================================
   EXTRACT NWS SECTION

   Pulls sections such as:

   * WHAT...
   * WHERE...
   * WHEN...
   * IMPACTS...
========================================================= */

function extractSection(
    text,
    section
) {

    if (!text) {

        return "";

    }


    const sections =

        "WHAT|WHERE|WHEN|IMPACTS|ADDITIONAL DETAILS";


    const regex =

        new RegExp(

            `\\*\\s*${section}\\.\\.\\.([\\s\\S]*?)(?=\\*\\s*(?:${sections})\\.\\.\\.|PRECAUTIONARY\\/PREPAREDNESS ACTIONS|&&|\\$\\$|$)`,

            "i"

        );


    const match =
        text.match(regex);


    if (!match) {

        return "";

    }


    return cleanText(
        match[1]
    );

}



/* =========================================================
   ALERT TYPE PRIORITY

   This is used AFTER zone priority.

   1 = Warning
   2 = Watch
   3 = Advisory
   4 = Other
========================================================= */

function getAlertPriority(alert) {


    const event =

        (
            alert.event ||
            ""
        ).toLowerCase();



    if (event.includes("warning")) {

        return 1;

    }



    if (event.includes("watch")) {

        return 2;

    }



    if (event.includes("advisory")) {

        return 3;

    }



    return 4;

}



/* =========================================================
   ZONE PRIORITY

   NEW BEDFORD ALWAYS WINS

   MAZ020 = priority 1
   ANZ234 = priority 2
========================================================= */

function getZonePriority(alert) {


    if (alert.zoneId === "MAZ020") {

        return 1;

    }


    if (alert.zoneId === "ANZ234") {

        return 2;

    }


    return 3;

}



/* =========================================================
   LOAD ALERTS
========================================================= */

async function loadAlerts() {


    const banner =

        document.getElementById(
            "alertBanner"
        );


    try {


        let alerts = [];



        /* =================================================
           CHECK BOTH NWS ZONES
        ================================================= */

        for (const zone of ZONES) {


            const url =

                `https://api.weather.gov/alerts/active/zone/${zone.id}`;



            const response =

                await fetch(

                    url,

                    {

                        headers: {

                            "Accept":
                                "application/geo+json"

                        }

                    }

                );



            if (!response.ok) {


                throw new Error(

                    `NWS API request failed for ${zone.id}`

                );

            }



            const data =

                await response.json();



            /* =================================================
               ADD ALERTS FROM THIS ZONE
            ================================================= */

            if (data.features) {


                data.features.forEach(

                    feature => {


                        const p =

                            feature.properties ||
                            {};



                        alerts.push({


                            id:

                                p.id ||
                                feature.id ||
                                "",


                            event:

                                p.event ||
                                "Weather Alert",


                            sent:

                                p.sent ||
                                p.effective ||
                                p.onset ||
                                "",


                            ends:

                                p.ends ||
                                p.expires ||
                                "",


                            description:

                                p.description ||
                                "",


                            headline:

                                p.headline ||
                                "",


                            severity:

                                p.severity ||
                                "",


                            zoneId:

                                zone.id,


                            zoneName:

                                zone.name


                        });


                    }

                );

            }

        }



        /* =================================================
           REMOVE DUPLICATE ALERTS
        ================================================= */

        const unique = [];

        const seen =
            new Set();



        alerts.forEach(

            alert => {


                const key =

                    alert.id ||

                    `${alert.event}-${alert.zoneId}`;



                if (!seen.has(key)) {


                    seen.add(key);


                    unique.push(
                        alert
                    );

                }

            }

        );



        /* =================================================
           SORT ALERTS

           FIRST:
           New Bedford beats Buzzards Bay

           THEN:
           Warning
           Watch
           Advisory
           Other

           Example:

           New Bedford Advisory
           beats
           Buzzards Bay Warning
        ================================================= */

        unique.sort(

            (a, b) => {


                const zoneDifference =

                    getZonePriority(a) -
                    getZonePriority(b);



                /* Zone always comes first */

                if (zoneDifference !== 0) {

                    return zoneDifference;

                }



                /* Same zone:
                   sort by alert severity/type */

                return (

                    getAlertPriority(a) -
                    getAlertPriority(b)

                );

            }

        );



        /* =================================================
           NO ACTIVE ALERTS
        ================================================= */

        if (unique.length === 0) {


            banner.className =

                "alert-banner no-alert";



            document.getElementById(
                "alertTitle"
            ).textContent =

                "No Active Weather or Marine Alerts";



            document.getElementById(
                "alertIssued"
            ).textContent =

                "--";



            document.getElementById(
                "alertEnds"
            ).textContent =

                "--";



            document.getElementById(
                "alertZone"
            ).textContent =

                "PORT OF NEW BEDFORD";



            document.getElementById(
                "alertWhat"
            ).textContent =

                "No active watches, warnings or advisories for New Bedford or Buzzards Bay.";



            document.getElementById(
                "alertImpact"
            ).style.display =

                "none";


            return;

        }



        /* =================================================
           ACTIVE ALERT
        ================================================= */

        banner.className =

            "alert-banner";



        document.getElementById(
            "alertImpact"
        ).style.display =

            "block";



        /*
           Because the array has already been sorted,
           alerts[0] is now:

           1. New Bedford alert, if one exists

           OR

           2. Buzzards Bay alert if New Bedford has none
        */

        const alert =

            unique[0];



        /* =================================================
           ALERT NAME
        ================================================= */

        document.getElementById(
            "alertTitle"
        ).textContent =

            alert.event ||
            "Weather Alert";



        /* =================================================
           ZONE
        ================================================= */

        document.getElementById(
            "alertZone"
        ).textContent =

            `${alert.zoneName} · ${alert.zoneId}`;



        /* =================================================
           ISSUED
        ================================================= */

        document.getElementById(
            "alertIssued"
        ).textContent =


            alert.sent

                ? formatDateTime(
                    alert.sent
                )

                : "Not reported";



        /* =================================================
           ENDS
        ================================================= */

        document.getElementById(
            "alertEnds"
        ).textContent =


            alert.ends

                ? formatDateTime(
                    alert.ends
                )

                : "Until further notice";



        /* =================================================
           WHAT
        ================================================= */

        const what =

            extractSection(

                alert.description,

                "WHAT"

            );



        const whatText =

            what ||

            alert.headline ||

            "See National Weather Service alert information.";



        document.getElementById(
            "alertWhat"
        ).textContent =

            whatText;



        document.getElementById(
            "alertWhat"
        ).title =

            whatText;



        /* =================================================
           IMPACTS
        ================================================= */

        const impacts =

            extractSection(

                alert.description,

                "IMPACTS"

            );



        const impactText =

            impacts ||

            "See National Weather Service alert for additional impacts.";



        document.getElementById(
            "impactText"
        ).textContent =

            impactText;



        document.getElementById(
            "alertImpact"
        ).title =

            impactText;


    }



    /* =====================================================
       ERROR
    ===================================================== */

    catch (error) {


        console.error(

            "NWS Alert Error:",

            error

        );



        banner.className =

            "alert-banner error";



        document.getElementById(
            "alertTitle"
        ).textContent =

            "Weather Alert Data Unavailable";



        document.getElementById(
            "alertIssued"
        ).textContent =

            "--";



        document.getElementById(
            "alertEnds"
        ).textContent =

            "--";



        document.getElementById(
            "alertZone"
        ).textContent =

            "PORT OF NEW BEDFORD";



        document.getElementById(
            "alertWhat"
        ).textContent =

            "Unable to retrieve current NWS weather and marine alerts.";



        document.getElementById(
            "alertImpact"
        ).style.display =

            "none";

    }

}



/* =========================================================
   INITIAL LOAD
========================================================= */

loadAlerts();



/* =========================================================
   REFRESH EVERY 5 MINUTES
========================================================= */

setInterval(

    loadAlerts,

    5 * 60 * 1000

);


</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buzzards Bay Marine Alert</title>

<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    background: transparent;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: #ffffff;
}


/* =========================================================
   ALERT BANNER
========================================================= */

.alert-banner {

    width: 100%;

    min-height: 105px;

    background: #c62828;

    border-radius: 7px;

    padding:
        12px 16px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    overflow: hidden;
}


/* =========================================================
   TOP ROW
========================================================= */

.alert-top {

    display: flex;

    align-items: center;

    flex-wrap: wrap;

    gap: 8px;

    min-width: 0;
}


/* ALERT NAME */

.alert-title {

    font-size: 17px;

    font-weight: 700;

    white-space: nowrap;
}


/* DIVIDERS */

.divider {

    opacity: 0.55;

    font-size: 12px;
}


/* ISSUED / ENDS */

.alert-time {

    font-size: 10px;

    white-space: nowrap;
}


.alert-time strong {

    font-weight: 700;
}


/* ZONE */

.zone {

    margin-left: auto;

    padding:
        3px 6px;

    border:
        1px solid rgba(255,255,255,0.6);

    border-radius: 3px;

    font-size: 8px;

    font-weight: 700;

    white-space: nowrap;
}


/* =========================================================
   MAIN HAZARD INFORMATION
========================================================= */

.alert-main {

    margin-top: 8px;

    font-size: 12px;

    font-weight: 700;

    line-height: 1.35;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================================================
   BOTTOM ROW
========================================================= */

.alert-bottom {

    margin-top: 6px;

    display: flex;

    align-items: center;

    flex-wrap: wrap;

    gap: 6px;

    font-size: 9px;

    line-height: 1.3;

    opacity: 0.95;
}


.alert-location {

    font-weight: 700;
}


/* =========================================================
   NO ALERT
========================================================= */

.alert-banner.no-alert {

    min-height: 70px;

    background: #4b6478;
}


.alert-banner.no-alert
.alert-main {

    margin-top: 5px;
}


/* =========================================================
   ERROR
========================================================= */

.alert-banner.error {

    background: #687684;
}


/* =========================================================
   MOBILE / NARROW EXPERIENCE BUILDER WIDGET
========================================================= */

@media (max-width: 650px) {

    .alert-banner {

        min-height: 115px;

        padding:
            10px 12px;
    }


    .alert-title {

        width: 100%;

        font-size: 15px;
    }


    .zone {

        margin-left: 0;
    }


    .alert-main {

        white-space: normal;

        font-size: 11px;
    }


    .divider.hide-small {

        display: none;
    }

}

</style>

</head>


<body>


<div
    id="alertBanner"
    class="alert-banner"
>


    <!-- =====================================================
         TOP ROW
    ====================================================== -->

    <div class="alert-top">


        <div
            id="alertTitle"
            class="alert-title"
        >
            Checking Marine Alerts...
        </div>


        <span class="divider">
            |
        </span>


        <div class="alert-time">

            <strong>
                Issued:
            </strong>

            <span id="alertIssued">
                --
            </span>

        </div>


        <span class="divider">
            |
        </span>


        <div class="alert-time">

            <strong>
                Ends:
            </strong>

            <span id="alertEnds">
                --
            </span>

        </div>


        <div class="zone">

            BUZZARDS BAY · ANZ234

        </div>


    </div>



    <!-- =====================================================
         IMPORTANT HAZARD INFORMATION
    ====================================================== -->

    <div
        id="alertMain"
        class="alert-main"
        title=""
    >

        Loading National Weather Service marine hazard information...

    </div>



    <!-- =====================================================
         LOCATION + IMPACT
    ====================================================== -->

    <div class="alert-bottom">


        <span
            id="alertLocation"
            class="alert-location"
        >
            Buzzards Bay
        </span>


        <span class="divider">
            |
        </span>


        <span id="alertImpact">

            Loading impact information...

        </span>


    </div>


</div>



<script>

/* =========================================================
   SETTINGS
========================================================= */

const ZONE =
    "ANZ234";

const TIMEZONE =
    "America/New_York";

const ALERT_URL =
    `https://api.weather.gov/alerts/active/zone/${ZONE}`;


/* =========================================================
   CLEAN TEXT
========================================================= */

function cleanText(text) {

    if (!text) {
        return "";
    }

    return text

        .replace(/\r/g, "")

        .replace(/\t/g, " ")

        .replace(/\n+/g, " ")

        .replace(/\s+/g, " ")

        .trim();
}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDateTime(dateString) {

    if (!dateString) {
        return "--";
    }

    const date =
        new Date(dateString);


    return date.toLocaleString(

        "en-US",

        {

            timeZone:
                TIMEZONE,

            weekday:
                "short",

            month:
                "short",

            day:
                "numeric",

            hour:
                "numeric",

            minute:
                "2-digit",

            hour12:
                true

        }

    );
}


/* =========================================================
   EXTRACT NWS ALERT SECTION
========================================================= */

function extractSection(
    text,
    section
) {

    if (!text) {
        return "";
    }


    const sections =
        "WHAT|WHERE|WHEN|IMPACTS|ADDITIONAL DETAILS";


    const regex =
        new RegExp(

            `\\*\\s*${section}\\.\\.\\.([\\s\\S]*?)(?=\\*\\s*(?:${sections})\\.\\.\\.|PRECAUTIONARY\\/PREPAREDNESS ACTIONS|&&|\\$\\$|$)`,

            "i"

        );


    const match =
        text.match(regex);


    if (!match) {
        return "";
    }


    return cleanText(
        match[1]
    );
}


/* =========================================================
   ALERT PRIORITY
========================================================= */

function getAlertPriority(alert) {

    const event =
        (
            alert.event ||
            ""
        ).toLowerCase();


    if (
        event.includes("warning")
    ) {
        return 1;
    }


    if (
        event.includes("watch")
    ) {
        return 2;
    }


    if (
        event.includes("advisory")
    ) {
        return 3;
    }


    return 4;
}


/* =========================================================
   LOAD ALERT
========================================================= */

async function loadAlert() {


    const banner =
        document.getElementById(
            "alertBanner"
        );


    try {


        const response =
            await fetch(

                ALERT_URL,

                {

                    headers: {

                        "Accept":
                            "application/geo+json"

                    }

                }

            );


        if (!response.ok) {

            throw new Error(
                "NWS alert request failed"
            );

        }


        const data =
            await response.json();


        const alerts =
            (data.features || [])

                .map(
                    feature =>
                        feature.properties
                )

                .sort(
                    (a, b) =>
                        getAlertPriority(a) -
                        getAlertPriority(b)
                );


        /* =================================================
           NO ACTIVE ALERT
        ================================================= */

        if (!alerts.length) {


            banner.className =
                "alert-banner no-alert";


            document.getElementById(
                "alertTitle"
            ).textContent =
                "No Active Marine Alerts";


            document.getElementById(
                "alertIssued"
            ).textContent =
                "--";


            document.getElementById(
                "alertEnds"
            ).textContent =
                "--";


            document.getElementById(
                "alertMain"
            ).textContent =
                "No watches, warnings or advisories currently reported for Buzzards Bay.";


            document.getElementById(
                "alertLocation"
            ).textContent =
                "Buzzards Bay · ANZ234";


            document.getElementById(
                "alertImpact"
            ).textContent =
                "No marine hazards currently reported.";


            return;

        }



        /* =================================================
           ACTIVE ALERT
        ================================================= */

        banner.className =
            "alert-banner";


        const alert =
            alerts[0];


        /* TITLE */

        document.getElementById(
            "alertTitle"
        ).textContent =
            alert.event ||
            "Marine Weather Alert";


        /* =================================================
           ISSUED
        ================================================= */

        const issuedTime =
            alert.sent ||
            alert.effective ||
            alert.onset;


        document.getElementById(
            "alertIssued"
        ).textContent =
            issuedTime
                ? formatDateTime(
                    issuedTime
                )
                : "Not reported";


        /* =================================================
           ENDS
        ================================================= */

        const endTime =
            alert.ends ||
            alert.expires;


        document.getElementById(
            "alertEnds"
        ).textContent =
            endTime
                ? formatDateTime(
                    endTime
                )
                : "Until further notice";


        /* =================================================
           DESCRIPTION
        ================================================= */

        const description =
            alert.description ||
            "";


        /* =================================================
           WHAT
        ================================================= */

        const what =
            extractSection(
                description,
                "WHAT"
            );


        const mainText =
            what ||
            alert.headline ||
            "See National Weather Service alert.";


        const main =
            document.getElementById(
                "alertMain"
            );


        main.textContent =
            mainText;


        /* Full text appears on hover */

        main.title =
            mainText;


        /* =================================================
           WHERE
        ================================================= */

        const where =
            extractSection(
                description,
                "WHERE"
            );


        document.getElementById(
            "alertLocation"
        ).textContent =
            where ||
            alert.areaDesc ||
            "Buzzards Bay";


        /* =================================================
           IMPACT
        ================================================= */

        const impacts =
            extractSection(
                description,
                "IMPACTS"
            );


        document.getElementById(
            "alertImpact"
        ).textContent =
            impacts ||
            "See NWS alert for marine impacts.";


    }


    catch (error) {


        console.error(
            "Marine Alert Error:",
            error
        );


        banner.className =
            "alert-banner error";


        document.getElementById(
            "alertTitle"
        ).textContent =
            "Marine Alert Data Unavailable";


        document.getElementById(
            "alertIssued"
        ).textContent =
            "--";


        document.getElementById(
            "alertEnds"
        ).textContent =
            "--";


        document.getElementById(
            "alertMain"
        ).textContent =
            "Unable to retrieve current National Weather Service marine alerts.";


        document.getElementById(
            "alertLocation"
        ).textContent =
            "Buzzards Bay · ANZ234";


        document.getElementById(
            "alertImpact"
        ).textContent =
            "Check the National Weather Service for current conditions.";

    }

}


/* =========================================================
   INITIAL LOAD
========================================================= */

loadAlert();


/* =========================================================
   REFRESH EVERY 5 MINUTES
========================================================= */

setInterval(

    loadAlert,

    5 * 60 * 1000

);

</script>


</body>

</html>
